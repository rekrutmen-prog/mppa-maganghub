<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPA - MagangHub Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mppaRed: '#E2144D',
                        mppaBlue: '#0094F5',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-200 min-h-screen flex flex-col items-center justify-start text-gray-800 m-0 p-0">

    <!-- WRAPPER UTAMA (Ukuran pas di tengah, sejajar/segaris di dalam bingkai HP) -->
    <div class="w-full max-w-[768px] bg-gray-50 min-h-screen flex flex-col justify-between shadow-2xl relative">

        <!-- MAIN CONTENT WRAPPER -->
        <div class="w-full">

            <!-- HEADER BANNER UTAMA -->
            <header class="w-full bg-white shadow-sm">
                <div class="w-full">
                    <img src="assets/images/banner-utama.png" alt="PT Matahari Putra Prima Tbk Banner" class="w-full h-auto object-cover shadow-md">
                </div>
            </header>

            <!-- SUB-HEADER BANNER: MagangHub (Dipastikan di dalam kontainer agar segaris & selalu bersebelahan) -->
            <div class="w-full bg-mppaBlue shadow-inner py-4 px-5 text-white">
                <div class="flex flex-row items-center justify-between gap-2">
                    <div class="flex items-center bg-white text-gray-900 px-3 py-2 rounded-xl shadow-sm shrink-0">
                        <img src="assets/images/logo-maganghub.png" alt="MagangHub" class="h-6 sm:h-8 object-contain">
                    </div>
                    <div class="text-right">
                        <h2 class="text-sm sm:text-lg font-bold tracking-wide leading-tight">Batch 3 Angkatan 2 (2026)</h2>
                    </div>
                </div>
            </div>

            <!-- MAIN INTERACTIVE CONTENT AREA -->
            <main class="w-full px-6 py-8 relative z-10">
                
                <!-- LOCATION SELECTOR SECTION -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center mb-8 relative z-20">
                    <label for="locationFilter" class="block text-base sm:text-lg font-bold text-gray-800 mb-3 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-location-dot text-mppaBlue text-lg"></i>
                        <span>Select Your Location</span>
                    </label>
                    <div class="w-full relative max-w-lg mx-auto z-30">
                        <select id="locationFilter" class="w-full appearance-none bg-gray-50 border border-gray-300 hover:border-mppaBlue focus:border-mppaBlue focus:ring-2 focus:ring-blue-100 rounded-xl px-4 py-3.5 pr-10 text-gray-700 font-medium text-base transition outline-none cursor-pointer shadow-sm relative z-30">
                            <option value="" disabled selected>-- Pilih Lokasi Penempatan --</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 z-30">
                            <i class="fa-solid fa-chevron-down text-base"></i>
                        </div>
                    </div>
                    <p id="helperText" class="text-xs text-gray-400 mt-3">Pilih wilayah di atas untuk menampilkan daftar lowongan.</p>
                </div>

                <!-- RESULTS SECTION -->
                <div id="resultsContainer" class="hidden fade-in">
                    
                    <!-- Action Prompt Divider -->
                    <div class="w-full border border-mppaBlue/30 bg-blue-50/50 rounded-xl py-3 px-4 text-center mb-6 shadow-xs">
                        <p class="text-mppaBlue font-semibold text-sm sm:text-base flex items-center justify-center gap-2">
                            <i class="fa-solid fa-hand-pointer animate-bounce"></i>
                            <span>Click Any Companies You Want to Apply!</span>
                        </p>
                    </div>

                    <!-- Cards List -->
                    <div id="jobsList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Cards injected dynamically -->
                    </div>
                </div>

                <!-- EMPTY STATE / INITIAL STATE -->
                <div id="emptyState" class="text-center py-14">
                    <div class="w-16 h-16 bg-blue-50 text-mppaBlue rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                        <i class="fa-solid fa-compass"></i>
                    </div>
                    <h3 class="text-gray-700 font-semibold text-base">Belum ada lokasi yang dipilih</h3>
                    <p class="text-gray-400 text-sm mt-1">Silakan pilih wilayah pada dropdown di atas.</p>
                </div>

            </main>
        </div>

        <!-- FOOTER SECTION -->
        <footer class="w-full bg-mppaRed text-white py-6 px-6 shadow-lg mt-auto">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
                
                <!-- Left Info Links with updated URLs -->
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-5 text-sm font-medium">
                    <a href="https://www.mppa.co.id" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-2 hover:opacity-85 transition">
                        <i class="fa-solid fa-globe text-base"></i>
                        <span>mppa.co.id</span>
                    </a>
                    <a href="https://www.instagram.com/mppa.careers/" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-2 hover:opacity-85 transition">
                        <i class="fa-brands fa-instagram text-base"></i>
                        <span>careers.mppa</span>
                    </a>
                    <a href="https://www.linkedin.com/company/matahari-putra-prima-tbk/posts/" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-2 hover:opacity-85 transition">
                        <i class="fa-brands fa-linkedin text-base"></i>
                        <span>LinkedIn</span>
                    </a>
                </div>

                <!-- Right Logo Group -->
                <div>
                    <img src="assets/images/mppa putih.png" alt="MPPA" class="h-7 object-contain">
                </div>

            </div>
        </footer>

    </div>

    <!-- JAVASCRIPT LOGIC & DUMMY DATA -->
    <script>
        const internshipData = [
            {
                id: 1,
                location: "Jabodetabek",
                companyName: "PT Matahari Putra Prima Tbk (Head Office)",
                locationDetail: "Tangerang, Banten",
                brandType: "Corporate",
                badgeColor: "bg-red-50 text-mppaRed border-red-200",
                logoPath: "assets/images/mppa putih.png",
                isCorporate: true,
                applyUrl: "https://maganghub.kemnaker.go.id/"
            },
            {
                id: 2,
                location: "Jabodetabek",
                companyName: "Hypermart Cyberpark",
                locationDetail: "Karawaci, Tangerang",
                brandType: "Hypermart",
                badgeColor: "bg-yellow-50 text-yellow-700 border-yellow-200",
                logoPath: "assets/images/hypermart.png",
                isCorporate: false,
                applyUrl: "https://maganghub.kemnaker.go.id/"
            },
            {
                id: 3,
                location: "Jabodetabek",
                companyName: "Hyfresh Bojongsari",
                locationDetail: "Bojongsari, Depok",
                brandType: "Hyfresh",
                badgeColor: "bg-blue-50 text-blue-700 border-blue-200",
                logoPath: "assets/images/hyfresh.png",
                isCorporate: false,
                applyUrl: "https://maganghub.kemnaker.go.id/"
            },
            {
                id: 4,
                location: "Jawa Barat",
                companyName: "Foodmart Supermarket Bandung",
                locationDetail: "Bandung, Jawa Barat",
                brandType: "Foodmart",
                badgeColor: "bg-green-50 text-green-700 border-green-200",
                logoPath: "assets/images/foodmart.png",
                isCorporate: false,
                applyUrl: "https://maganghub.kemnaker.go.id/"
            },
            {
                id: 5,
                location: "Jawa Barat",
                companyName: "Bread & Butter Setiabudi",
                locationDetail: "Bandung, Jawa Barat",
                brandType: "Bread & Butter",
                badgeColor: "bg-pink-50 text-pink-700 border-pink-200",
                logoPath: "assets/images/bread.png",
                isCorporate: false,
                applyUrl: "https://maganghub.kemnaker.go.id/"
            },
            {
                id: 6,
                location: "Bali",
                companyName: "Primo Supermarket Bali",
                locationDetail: "Denpasar, Bali",
                brandType: "Primo",
                badgeColor: "bg-amber-50 text-amber-700 border-amber-200",
                logoPath: "assets/images/hypermart.png",
                isCorporate: false,
                applyUrl: "https://maganghub.kemnaker.go.id/"
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const locationSelect = document.getElementById("locationFilter");
            const resultsContainer = document.getElementById("resultsContainer");
            const emptyState = document.getElementById("emptyState");
            const jobsList = document.getElementById("jobsList");

            const uniqueLocations = [...new Set(internshipData.map(item => item.location))].sort();

            uniqueLocations.forEach(loc => {
                const option = document.createElement("option");
                option.value = loc;
                option.textContent = loc;
                locationSelect.appendChild(option);
            });

            locationSelect.addEventListener("change", (e) => {
                const selectedLocation = e.target.value;
                const filteredJobs = internshipData.filter(item => item.location === selectedLocation);

                if (filteredJobs.length > 0) {
                    emptyState.classList.add("hidden");
                    resultsContainer.classList.remove("hidden");

                    jobsList.innerHTML = filteredJobs.map(job => `
                        <a href="${job.applyUrl}" target="_blank" rel="noopener noreferrer" 
                           class="group bg-white border border-gray-200 hover:border-mppaBlue rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-200 flex items-center gap-4">
                            <div class="w-[100px] h-[100px] min-w-[100px] min-h-[100px] ${job.isCorporate ? 'bg-mppaRed' : 'bg-white'} rounded-xl border border-gray-100 flex items-center justify-center p-2 shadow-sm shrink-0">
                                <img src="${job.logoPath}" alt="${job.brandType}" class="max-h-full max-w-full object-contain">
                            </div>
                            <div class="flex-grow min-w-0">
                                <h4 class="font-bold text-gray-800 text-sm sm:text-base truncate group-hover:text-mppaBlue transition mb-1">
                                    ${job.companyName}
                                </h4>
                                <p class="text-xs sm:text-sm text-gray-500 flex items-center gap-1 truncate">
                                    <i class="fa-solid fa-map-pin text-mppaRed shrink-0"></i>
                                    <span class="truncate">${job.locationDetail}</span>
                                </p>
                            </div>
                        </a>
                    `).join("");
                } else {
                    emptyState.classList.remove("hidden");
                    resultsContainer.classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>
