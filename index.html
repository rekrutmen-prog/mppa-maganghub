    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mppaRed: '#E2144D',
                        mppaBlue: '#0094F5',

        body {

        }

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <!-- MOBILE CONTAINER (Tampilan Layar HP di Tengah Laptop) -->

            </div>

            <!-- MAIN INTERACTIVE CONTENT AREA -->
            <main class="w-full px-4 py-6">
                
                <!-- LOCATION SELECTOR SECTION -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center mb-6">
                    <label for="locationFilter" class="block text-base font-bold text-gray-800 mb-3 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-location-dot text-mppaBlue"></i>
                        <span>Select Your Location</span>
                    </label>
                    <div class="w-full relative">
                        <select id="locationFilter" class="w-full appearance-none bg-gray-50 border border-gray-300 hover:border-mppaBlue focus:border-mppaBlue focus:ring-2 focus:ring-blue-100 rounded-xl px-4 py-3.5 pr-10 text-gray-700 font-medium text-sm transition outline-none cursor-pointer shadow-sm">
                            <option value="" disabled selected>-- Pilih Lokasi Penempatan --</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                    <p id="helperText" class="text-[11px] text-gray-400 mt-2">Pilih wilayah di atas untuk menampilkan lowongan.</p>
                </div>

                <!-- RESULTS SECTION -->
                <div id="resultsContainer" class="hidden fade-in">
                    
                    <!-- Action Prompt Divider -->
                    <div class="w-full border border-mppaBlue/30 bg-blue-50/50 rounded-xl py-2.5 px-3 text-center mb-4 shadow-xs">
                        <p class="text-mppaBlue font-semibold text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-hand-pointer animate-bounce"></i>
                            <span>Click Any Companies You Want to Apply!</span>
                        </p>
                    </div>

                    <!-- Cards List (Tampil 1 kolom memanjang ala HP) -->
                    <div id="jobsList" class="flex flex-col gap-3">
                        <!-- Cards injected dynamically -->
                    </div>
                </div>

                <!-- EMPTY STATE / INITIAL STATE -->
                <div id="emptyState" class="text-center py-10">
                    <div class="w-14 h-14 bg-blue-50 text-mppaBlue rounded-full flex items-center justify-center mx-auto mb-3 text-xl shadow-inner">
                        <i class="fa-solid fa-compass"></i>
                    </div>
                    <h3 class="text-gray-600 font-semibold text-sm">Belum ada lokasi yang dipilih</h3>
                    <p class="text-gray-400 text-xs mt-1">Silakan pilih wilayah pada dropdown di atas.</p>
                </div>

            </main>
        </div>

        <!-- FOOTER SECTION -->
        <footer class="w-full bg-mppaRed text-white py-5 px-4 shadow-lg mt-auto">
            <div class="flex flex-col items-center justify-center gap-4 text-center">
                
                <!-- Left Info Links with updated URLs -->
                <div class="flex flex-wrap items-center justify-center gap-4 text-xs font-medium">
                    <a href="https://www.mppa.co.id" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 hover:opacity-85 transition">
                        <i class="fa-solid fa-globe"></i>
                        <span>mppa.co.id</span>
                    </a>
                    <a href="https://www.instagram.com/mppa.careers/" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 hover:opacity-85 transition">
                        <i class="fa-brands fa-instagram"></i>
                        <span>careers.mppa</span>
                    </a>
                    <a href="https://www.linkedin.com/company/matahari-putra-prima-tbk/posts/" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 hover:opacity-85 transition">
                        <i class="fa-brands fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </a>
                </div>

                <!-- Right Logo Group -->
                <div>
                    <img src="assets/images/mppa putih.png" alt="MPPA" class="h-6 object-contain">
                </div>

            </div>
        </footer>

    </div>
